name: E2E

# Stands in for e2e.yaml: the pull_request gate.
#
# It is now only the gate. The command used to dispatch a wrapper that called
# this workflow, to keep command checks from colliding with the gate's rows; that
# turned out to be unnecessary, because the checks UI never renders check suites
# from workflow_dispatch runs at all. The command dispatches
# caller-e2e-{pro,oss}-run.yaml directly and reports through API-created
# check-runs instead.
#
# Its path filter matches those two, so a change to either still re-runs the gate
# here and the two kinds of check can be observed on one commit.

on:
  pull_request:
    paths:
      - ".github/workflows/caller-e2e*.yaml"
  workflow_call:
    inputs:
      filter:
        description: "Label filter. Empty on the gate, where the mandatory suite is implied."
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite
    uses: ./.github/workflows/caller-e2e-suite.yaml
    with:
      # The gate has no inputs context, so this is the mandatory suite there and
      # the author's filter when called by the command.
      filter: ${{ inputs.filter || 'pr' }}
