name: Secret broker response integration

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no secrets or requester code enter the contents-write test job
    workflows:
      - Secret broker request integration
    types:
      - completed

permissions: {}

concurrency:
  group: secret-broker-response-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify GitHub authorization
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'secret-broker-request/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      authorization: ${{ steps.authorize.outputs.authorization }}
    steps:
      - name: Reject membership in an unknown team
        id: denied
        continue-on-error: true
        uses: loft-sh/github-actions/.github/actions/secret-broker-request@011c5d3c389a88142d96a93100cfb03408846049 # test pin: github-actions#252
        with:
          app-client-id: ${{ vars.AUTH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          organization: loft-sh
          team: secret-broker-integration-unknown
          allowed-secret-aliases: integration/test-secret

      - name: Verify unknown team was denied
        if: ${{ steps.denied.outcome != 'failure' }}
        run: |
          echo "::error::authorization accepted an unknown team"
          exit 1

      - name: Authorize active team member
        id: authorize
        uses: loft-sh/github-actions/.github/actions/secret-broker-request@011c5d3c389a88142d96a93100cfb03408846049 # test pin: github-actions#252
        with:
          app-client-id: ${{ vars.AUTH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          organization: loft-sh
          team: eng-devops
          allowed-secret-aliases: integration/test-secret

  preflight:
    name: Verify claim and replay protection
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      claim-key: ${{ steps.verify.outputs.claim-key }}
    steps:
      - name: Change the authorized request digest
        id: tamper
        env:
          AUTHORIZATION: ${{ needs.authorize.outputs.authorization }}
        run: |
          python3 - <<'PY'
          import json
          import os

          authorization = json.loads(os.environ["AUTHORIZATION"])
          authorization["request_sha256"] = "0" * 64
          value = json.dumps(authorization, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"authorization={value}\n")
          PY

      - name: Reject changed authorization
        id: changed
        continue-on-error: true
        uses: loft-sh/github-actions/.github/actions/secret-broker-request@011c5d3c389a88142d96a93100cfb03408846049 # test pin: github-actions#252
        with:
          authorization: ${{ steps.tamper.outputs.authorization }}

      - name: Verify changed authorization was denied
        if: ${{ steps.changed.outcome != 'failure' }}
        run: |
          echo "::error::preflight accepted changed authorization"
          exit 1

      - name: Claim request
        id: preflight
        uses: loft-sh/github-actions/.github/actions/secret-broker-request@011c5d3c389a88142d96a93100cfb03408846049 # test pin: github-actions#252
        with:
          authorization: ${{ needs.authorize.outputs.authorization }}

      - name: Verify private bundle
        id: verify
        env:
          BUNDLE: ${{ steps.preflight.outputs.bundle }}
          REQUEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          request_id="${REQUEST_BRANCH#secret-broker-request/}"
          test "$(stat -c %a "${BUNDLE}")" = 700
          test "$(stat -c %a "${BUNDLE}/request.json")" = 600
          test "$(stat -c %a "${BUNDLE}/public.pem")" = 600
          test "$(stat -c %a "${BUNDLE}/authorization.json")" = 600
          test "$(jq -r .request_id "${BUNDLE}/request.json")" = "${request_id}"
          openssl x509 -in "${BUNDLE}/public.pem" -noout -subject
          echo "claim-key=$(jq -r .request_sha256 "${BUNDLE}/authorization.json")" \
            >>"${GITHUB_OUTPUT}"

      - name: Reject replayed request
        id: replay
        continue-on-error: true
        uses: loft-sh/github-actions/.github/actions/secret-broker-request@011c5d3c389a88142d96a93100cfb03408846049 # test pin: github-actions#252
        with:
          authorization: ${{ needs.authorize.outputs.authorization }}

      - name: Verify replay was denied
        if: ${{ steps.replay.outcome != 'failure' }}
        run: |
          echo "::error::preflight accepted a replayed request"
          exit 1

  cleanup:
    name: Remove integration refs
    needs: [authorize, preflight]
    if: ${{ always() && needs.authorize.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Delete request branch and test claim
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CLAIM_KEY: ${{ needs.preflight.outputs.claim-key }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REQUEST_BRANCH}" || true
          if [[ -n "${CLAIM_KEY}" ]]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/secret-broker-processed/${CLAIM_KEY}" || true
          fi
