name: Comment-triggered check (command)

# Integration check for the comment-triggered-check action, mirroring
# vcluster-pro's e2e-command.yaml with sleeps standing in for the suites.
#
# `/test-e2e <filter>` opens one check-run per selected tree. By default it
# dispatches both; `--target pro|oss` narrows the command to one tree.
#
# This repository exists because `issue_comment` only ever fires from the copy of
# a workflow on the DEFAULT BRANCH, so the command cannot be exercised from the
# pull request that introduces it. Every change here has to reach main before it
# does anything.
#
# Outcomes are injected through the filter text; see caller-e2e-pro-run.yaml.
#   /test-e2e ok           both green
#   /test-e2e oss-fail     pro green, oss red
#   /test-e2e nothing      both neutral
#
# The rolling action tag now includes target selection from
# loft-sh/github-actions#269.

on:
  issue_comment:
    types: [created]

# Nothing repository-wide. This is a privileged trigger: it runs from the
# default branch with a write token on every comment in the repository, so each
# job takes only what it needs.
permissions: {}

jobs:
  prepare:
    name: Parse command
    # Cheap pre-filter. Most comments are not commands, and the action checks
    # properly; this only avoids spinning a runner to find that out. `contains`
    # rather than `startsWith`, because the action trims the first line before
    # matching and expressions have no trim.
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/test-e2e') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      should-run: >-
        ${{
          (steps.pro.outputs.should-run == 'true' || steps.oss.outputs.should-run == 'true') &&
          (steps.pro.outputs.target != '' || steps.oss.outputs.should-run == 'true')
        }}
      matched: ${{ steps.pro.outputs.matched }}
      filter: ${{ steps.pro.outputs.filter }}
      focus: ${{ steps.pro.outputs.focus }}
      target: ${{ steps.pro.outputs.target }}
      head-ref: ${{ steps.pro.outputs.target == 'oss' && steps.oss.outputs.head-ref || steps.pro.outputs.head-ref }}
      head-sha: ${{ steps.pro.outputs.target == 'oss' && steps.oss.outputs.head-sha || steps.pro.outputs.head-sha }}
      key: ${{ steps.pro.outputs.target == 'oss' && steps.oss.outputs.concurrency-key || steps.pro.outputs.concurrency-key }}
      pro-check-run-id: ${{ steps.pro.outputs.check-run-id }}
      oss-check-run-id: ${{ steps.oss.outputs.check-run-id }}

    steps:
      # Deliberately checks out nothing. A privileged trigger that checked out
      # the pull request and then called a local action would resolve the action
      # DEFINITION from the pull request and run it with this token.
      - name: Parse the command and open the pro check
        id: pro
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@comment-triggered-check/v1
        with:
          mode: start
          command: /test-e2e
          check-name-prefix: e2e-pro
          parse-focus: true
          target-name: pro
          comment-body: ${{ github.event.comment.body }}
          comment-author: ${{ github.event.comment.user.login }}
          author-association: ${{ github.event.comment.author_association }}
          pr-number: ${{ github.event.issue.number }}
          run-id: ${{ github.run_id }}
          server-url: ${{ github.server_url }}

      - name: Open the oss check
        id: oss
        if: ${{ steps.pro.outputs.target == 'oss' || (steps.pro.outputs.target == '' && steps.pro.outputs.should-run == 'true') }}
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@comment-triggered-check/v1
        with:
          mode: start
          command: /test-e2e
          check-name-prefix: e2e-oss
          parse-focus: true
          target-name: oss
          comment-body: ${{ github.event.comment.body }}
          comment-author: ${{ github.event.comment.user.login }}
          author-association: ${{ github.event.comment.author_association }}
          pr-number: ${{ github.event.issue.number }}
          run-id: ${{ github.run_id }}
          server-url: ${{ github.server_url }}

      # Two creates mean the first can succeed and the second fail, and a failed
      # prepare skips the dispatch job that would otherwise close things. Without
      # this the pro check sits in progress forever.
      - name: Close whatever was opened if preparing failed
        if: failure()
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@comment-triggered-check/v1
        with:
          mode: finish
          check-run-id: ${{ steps.pro.outputs.check-run-id }}
          suite-result: failure
          summary: "Could not open both checks for this command. See the run log for details."
          details-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Explain a refusal
        if: >-
          ${{
            steps.pro.outputs.matched == 'true' &&
            (
              (steps.pro.outputs.reason != '' && steps.pro.outputs.reason != 'target-not-selected') ||
              (steps.oss.outputs.reason != '' && steps.oss.outputs.reason != 'target-not-selected')
            )
          }}
        uses: loft-sh/github-actions/.github/actions/sticky-pr-comment@ee112eee4fb449b7b1e78f63fdec314563be534d # sticky-pr-comment/v1
        with:
          # Required. The input defaults to github.event.pull_request.number,
          # which is empty on issue_comment, and the action then refuses.
          pr-number: ${{ github.event.issue.number }}
          marker: '<!-- e2e-command-status -->'
          body: |
            ### `/test-e2e` did not run

            | Reason | What to do |
            | --- | --- |
            | ${{ steps.pro.outputs.reason-title || steps.oss.outputs.reason-title }} | ${{ steps.pro.outputs.reason-guidance || steps.oss.outputs.reason-guidance }} |
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The outputs are the thing under test, so print them and let the job log
      # be the record. Both ids, because two distinct check-runs is the claim.
      - name: Report the decision
        if: always()
        env:
          MATCHED: ${{ steps.pro.outputs.matched }}
          SHOULD_RUN: ${{ steps.pro.outputs.should-run }}
          REASON: ${{ steps.pro.outputs.reason }}
          FILTER: ${{ steps.pro.outputs.filter }}
          FOCUS: ${{ steps.pro.outputs.focus }}
          HEAD_SHA: ${{ steps.pro.outputs.head-sha }}
          HEAD_REF: ${{ steps.pro.outputs.head-ref }}
          KEY: ${{ steps.pro.outputs.concurrency-key }}
          PRO_CHECK_NAME: ${{ steps.pro.outputs.check-name }}
          PRO_CHECK_RUN_ID: ${{ steps.pro.outputs.check-run-id }}
          OSS_CHECK_NAME: ${{ steps.oss.outputs.check-name }}
          OSS_CHECK_RUN_ID: ${{ steps.oss.outputs.check-run-id }}
        run: |
          {
            echo "| Output | Value |"
            echo "| --- | --- |"
            echo "| matched | \`${MATCHED}\` |"
            echo "| should-run | \`${SHOULD_RUN}\` |"
            echo "| reason | \`${REASON}\` |"
            echo "| filter | \`${FILTER}\` |"
            echo "| focus | \`${FOCUS}\` |"
            echo "| head-sha | \`${HEAD_SHA}\` |"
            echo "| head-ref | \`${HEAD_REF}\` |"
            echo "| concurrency-key | \`${KEY}\` |"
            echo "| pro check-name | \`${PRO_CHECK_NAME}\` |"
            echo "| pro check-run-id | \`${PRO_CHECK_RUN_ID}\` |"
            echo "| oss check-name | \`${OSS_CHECK_NAME}\` |"
            echo "| oss check-run-id | \`${OSS_CHECK_RUN_ID}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${SHOULD_RUN}" == "true" && "${PRO_CHECK_RUN_ID}" == "${OSS_CHECK_RUN_ID}" ]]; then
            echo "::error::both starts returned the same check-run id; they must be distinct"
            exit 1
          fi

  # The privileged half ends here. The work runs in separate, non-privileged runs
  # on the head branch, which is the trust model a pull_request gate already has.
  dispatch:
    name: Dispatch the suites
    needs: [prepare]
    if: ${{ needs.prepare.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job checks out nothing, so gh has no git remote to infer the
      # repository from and fails before it reaches the API.
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ needs.prepare.outputs.head-ref }}
      HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
      FILTER: ${{ needs.prepare.outputs.filter }}
      FOCUS: ${{ needs.prepare.outputs.focus }}
      KEY: ${{ needs.prepare.outputs.key }}

    steps:
      # Both dispatches are attempted even if the first fails, so one broken tree
      # never silently costs the other its run.
      - name: Run the pro suite on the head branch
        id: dispatch-pro
        if: ${{ needs.prepare.outputs.target != 'oss' }}
        continue-on-error: true
        env:
          CHECK_RUN_ID: ${{ needs.prepare.outputs.pro-check-run-id }}
        run: |
          gh workflow run caller-e2e-pro-run.yaml \
            --ref "$HEAD_REF" \
            -f "ginkgo-label=$FILTER" \
            -f "ginkgo-focus=$FOCUS" \
            -f "head-sha=$HEAD_SHA" \
            -f "compose-with-pr=false" \
            -f "concurrency-key=$KEY" \
            -f "check-run-id=$CHECK_RUN_ID"

      - name: Run the oss suite on the head branch
        id: dispatch-oss
        if: ${{ needs.prepare.outputs.target != 'pro' }}
        continue-on-error: true
        env:
          CHECK_RUN_ID: ${{ needs.prepare.outputs.oss-check-run-id }}
        run: |
          gh workflow run caller-e2e-oss-run.yaml \
            --ref "$HEAD_REF" \
            -f "ginkgo-label=$FILTER" \
            -f "ginkgo-focus=$FOCUS" \
            -f "head-sha=$HEAD_SHA" \
            -f "compose-with-pr=false" \
            -f "concurrency-key=$KEY" \
            -f "check-run-id=$CHECK_RUN_ID"

      - name: Say what it picked
        if: always()
        uses: loft-sh/github-actions/.github/actions/sticky-pr-comment@ee112eee4fb449b7b1e78f63fdec314563be534d # sticky-pr-comment/v1
        with:
          # Required here. The input defaults to github.event.pull_request.number,
          # which is empty on issue_comment, and the action then refuses.
          pr-number: ${{ github.event.issue.number }}
          marker: '<!-- e2e-command-status -->'
          body: |
            ### `/test-e2e` started

            Target: `${{ needs.prepare.outputs.target != '' && needs.prepare.outputs.target || 'pro + oss' }}`

            - **Pro:** ${{ needs.prepare.outputs.target == 'oss' && 'Not requested' || steps.dispatch-pro.outcome == 'success' && 'Started' || 'Failed to start' }}
            - **OSS:** ${{ needs.prepare.outputs.target == 'pro' && 'Not requested' || steps.dispatch-oss.outcome == 'success' && 'Started' || 'Failed to start' }}

            Filter: `${{ needs.prepare.outputs.filter }}`
            ${{ needs.prepare.outputs.focus != '' && format('Focus: `{0}`', needs.prepare.outputs.focus) || '' }}

            If no specs match in a selected tree, its check reports **Nothing to run**.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Close the pro check if its dispatch failed
        if: ${{ steps.dispatch-pro.outcome == 'failure' }}
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@comment-triggered-check/v1
        with:
          mode: finish
          check-run-id: ${{ needs.prepare.outputs.pro-check-run-id }}
          suite-result: failure
          summary: "Could not start the pro suite. See the run log for details."
          details-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Close the oss check if its dispatch failed
        if: ${{ steps.dispatch-oss.outcome == 'failure' }}
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@comment-triggered-check/v1
        with:
          mode: finish
          check-run-id: ${{ needs.prepare.outputs.oss-check-run-id }}
          suite-result: failure
          summary: "Could not start the staged OSS suite. See the run log for details."
          details-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # continue-on-error above keeps the job green, which would hide a failed
      # dispatch from anyone reading the run rather than the checks.
      - name: Fail if either dispatch failed
        if: ${{ steps.dispatch-pro.outcome == 'failure' || steps.dispatch-oss.outcome == 'failure' }}
        run: exit 1
