name: Secret broker request integration

on:
  workflow_dispatch:
  push:
    branches:
      - secret-broker-request/**

permissions: {}

jobs:
  create:
    name: Create short-lived request
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Push request as the integration actor
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          request_id="$(date -u +%s)-$(openssl rand -hex 12)"
          request_branch="secret-broker-request/${request_id}"
          request_dir="${RUNNER_TEMP}/secret-broker-request"
          mkdir -m 700 "${request_dir}"

          openssl req \
            -x509 \
            -newkey rsa:3072 \
            -sha256 \
            -days 1 \
            -nodes \
            -subj "/CN=secret-broker-request-${request_id}" \
            -keyout "${request_dir}/private.pem" \
            -out "${request_dir}/public.pem" \
            2>/dev/null

          jq -n \
            --arg request_id "${request_id}" \
            --arg public_key "$(<"${request_dir}/public.pem")" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg expires_at "$(date -u -d '+9 minutes' +%Y-%m-%dT%H:%M:%SZ)" \
            --arg nonce "$(openssl rand -hex 16)" \
            '{
              request_version: 1,
              request_id: $request_id,
              requested_secret_alias: "integration/test-secret",
              ephemeral_public_key: $public_key,
              created_at: $created_at,
              expires_at: $expires_at,
              nonce: $nonce
            }' >.secret-broker-request.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "${request_branch}"
          git add .secret-broker-request.json
          git commit -m "test: create secret broker request"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin HEAD

  queue:
    name: Queue request
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Request queued for integration testing."
