name: Verify matrix output fan-in

on:
  pull_request:
    paths:
      - '.github/scripts/assert-matrix-output-fan-in.py'
      - '.github/workflows/verify-matrix-output-fan-in.yaml'

permissions: {}

jobs:
  cve-scan:
    name: Synthetic CVE scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    outputs:
      vcluster-pro: ${{ steps.export-cve-result.outputs.vcluster-pro }}
      vcluster-oss: ${{ steps.export-cve-result.outputs.vcluster-oss }}
      vcluster-cli: ${{ steps.export-cve-result.outputs.vcluster-cli }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vcluster-pro
            result-name: vcluster-pro
            result-json: '{"image":"ghcr.io/loft-sh/vcluster-pro:v0.38.0-rc.1","critical":1,"high":2,"medium":3,"low":4,"status":"completed"}'
          - name: vcluster-oss
            result-name: vcluster-oss
            result-json: '{"image":"ghcr.io/loft-sh/vcluster-oss:v0.38.0-rc.1","critical":0,"high":1,"medium":2,"low":3,"status":"completed"}'
          - name: vcluster-cli
            result-name: vcluster-cli
            result-json: '{"image":"ghcr.io/loft-sh/vcluster-cli:v0.38.0-rc.1","critical":0,"high":0,"medium":1,"low":2,"status":"completed"}'
    steps:
      - name: Export synthetic CVE scan result
        id: export-cve-result
        env:
          RESULT_NAME: ${{ matrix.result-name }}
          RESULT_JSON: ${{ matrix.result-json }}
        run: printf '%s=%s\n' "$RESULT_NAME" "$RESULT_JSON" >> "$GITHUB_OUTPUT"

  verify-fan-in:
    name: Verify all matrix outputs reached the consumer
    needs: cve-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Assert aggregate output contract
        env:
          SCAN_RESULTS: ${{ toJSON(needs.cve-scan.outputs) }}
        run: python3 .github/scripts/assert-matrix-output-fan-in.py
