name: Platform command mock run

on:
  workflow_dispatch:
    inputs:
      ginkgo-label:
        description: Filter from the comment command.
        required: true
        type: string
      ginkgo-focus:
        description: Focus regex from the comment command.
        required: false
        type: string
      head-sha:
        description: Commit the check was opened on.
        required: true
        type: string
      check-run-id:
        description: Check-run completed by the finish job.
        required: true
        type: string
      concurrency-key:
        description: Normalized filter key.
        required: true
        type: string
      pr-number:
        description: Pull request scope for concurrency.
        required: true
        type: string

permissions: {}

# A fork run can restore caches but never save them.
cache-mode: read

jobs:
  suite:
    name: Mock Platform suite
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: platform-command-${{ inputs.pr-number }}-${{ inputs.concurrency-key }}
      cancel-in-progress: true
    outputs:
      check-conclusion: ${{ steps.conclusion.outputs.check-conclusion }}
    steps:
      # The workflow comes from a trusted branch, the code from the captured SHA.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head-sha }}
          persist-credentials: false

      - name: Verify head SHA
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$EXPECTED_HEAD_SHA" != "$ACTUAL_HEAD_SHA" ]]; then
            echo "::error::expected ${EXPECTED_HEAD_SHA}, checked out ${ACTUAL_HEAD_SHA}"
            exit 1
          fi

      - name: Simulate suite
        env:
          FILTER: ${{ inputs.ginkgo-label }}
          FOCUS: ${{ inputs.ginkgo-focus }}
        run: |
          echo "tested commit: $(git log -1 --format='%H %s')"
          if [[ -f fork-marker.txt ]]; then echo "fork marker: $(cat fork-marker.txt)"; fi
          sleep 60
          printf 'filter=%s\nfocus=%s\n' "$FILTER" "$FOCUS"
          [[ "$FILTER" != *fail* ]] || exit 1

      # Expected to be skipped by cache-mode: read. repro/fork-command checks
      # afterwards that no cache with this key exists.
      - name: Try to save a cache
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fork-marker.txt
          key: fork-cache-probe-platform-${{ github.run_id }}

      - name: Derive result
        id: conclusion
        if: ${{ !cancelled() }}
        env:
          FILTER: ${{ inputs.ginkgo-label }}
          FOCUS: ${{ inputs.ginkgo-focus }}
          RESULT: ${{ job.status }}
        run: |
          if [[ "$RESULT" != success || "$FILTER" == *nothing* || "$FOCUS" == *nothing* ]]; then
            conclusion=failure
          else
            conclusion=success
          fi
          echo "check-conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

  finish:
    name: Publish mock result
    needs: [suite]
    if: ${{ always() && inputs.check-run-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Complete check
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@comment-triggered-check/v1
        with:
          mode: finish
          check-run-id: ${{ inputs.check-run-id }}
          report-conclusion: ${{ needs.suite.result != 'cancelled' && needs.suite.outputs.check-conclusion || '' }}
          suite-result: ${{ needs.suite.result }}
          details-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
