name: Platform command integration

# Single-check variant of the comment-triggered workflow used by
# loft-enterprise. Kept separate from the vcluster-pro two-tree harness.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  prepare:
    name: Parse command
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/test-platform-e2e') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      should-run: ${{ steps.command.outputs.should-run == 'true' && steps.contract.outcome == 'success' }}
      filter: ${{ steps.command.outputs.filter }}
      focus: ${{ steps.command.outputs.focus }}
      is-fork: ${{ steps.command.outputs.is-fork }}
      head-ref: ${{ steps.command.outputs.head-ref }}
      base-ref: ${{ steps.command.outputs.base-ref }}
      head-sha: ${{ steps.command.outputs.head-sha }}
      key: ${{ steps.command.outputs.concurrency-key }}
      check-run-id: ${{ steps.command.outputs.check-run-id }}
      runs: ${{ steps.command.outputs.runs }}

    steps:
      - name: Parse command and open check
        id: command
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@devops-1843/test-e2e-run-reply
        with:
          mode: start
          command: /test-platform-e2e
          check-name-prefix: e2e-platform
          parse-focus: true
          parse-runs: true
          reply: "true"
          comment-id: ${{ github.event.comment.id }}
          run-label: Platform
          comment-body: ${{ github.event.comment.body }}
          comment-author: ${{ github.event.comment.user.login }}
          author-association: ${{ github.event.comment.author_association }}
          allow-forks: true
          pr-number: ${{ github.event.issue.number }}
          run-id: ${{ github.run_id }}
          server-url: ${{ github.server_url }}

      # The contract lives on the workflow that will run: the PR head for
      # same-repository PRs, the target branch for forks.
      - name: Verify the branch supports command dispatch
        id: contract
        if: ${{ steps.command.outputs.should-run == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRACT_REF: ${{ steps.command.outputs.is-fork == 'true' && steps.command.outputs.base-ref || steps.command.outputs.head-sha }}
        run: gh api "repos/${GITHUB_REPOSITORY}/contents/.github/e2e-command-contract-v2?ref=${CONTRACT_REF}" >/dev/null

      - name: Close the check if the branch has no contract
        if: ${{ always() && steps.command.outputs.should-run == 'true' && steps.contract.outcome != 'success' }}
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@devops-1843/test-e2e-run-reply
        with:
          mode: finish
          check-run-id: ${{ steps.command.outputs.check-run-id }}
          report-conclusion: neutral
          summary: This branch does not support /test-platform-e2e.
          details-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Explain refusal
        if: ${{ steps.command.outputs.matched == 'true' && steps.command.outputs.should-run != 'true' }}
        uses: loft-sh/github-actions/.github/actions/sticky-pr-comment@sticky-pr-comment/v1
        with:
          pr-number: ${{ github.event.issue.number }}
          marker: '<!-- platform-e2e-command-error -->'
          body: |
            `/test-platform-e2e` refused the command: `${{ steps.command.outputs.reason }}`.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  dispatch:
    name: Dispatch suite (${{ matrix.run.check-name }})
    needs: [prepare]
    if: ${{ needs.prepare.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    # One job per --runs run, like loft-enterprise, so the links race for the reply.
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.prepare.outputs.runs) }}
    permissions:
      actions: write
      checks: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Same-repository PRs run their branch's workflow. Forks use the target
      # branch's workflow because their branch does not exist in this repo.
      WORKFLOW_REF: ${{ needs.prepare.outputs.is-fork == 'true' && needs.prepare.outputs.base-ref || needs.prepare.outputs.head-ref }}
      HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
      FILTER: ${{ needs.prepare.outputs.filter }}
      FOCUS: ${{ needs.prepare.outputs.focus }}
      KEY: ${{ matrix.run.concurrency-key }}
      CHECK_RUN_ID: ${{ matrix.run.check-run-id }}
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Dispatch mock Platform suite
        id: dispatch
        continue-on-error: true
        run: |
          output="$(gh workflow run caller-platform-run.yaml \
            --ref "$WORKFLOW_REF" \
            -f "ginkgo-label=$FILTER" \
            -f "ginkgo-focus=$FOCUS" \
            -f "head-sha=$HEAD_SHA" \
            -f "concurrency-key=$KEY" \
            -f "pr-number=$PR_NUMBER" \
            -f "check-run-id=$CHECK_RUN_ID" 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          # gh prints the URL of the run it started.
          url="$(grep -Eo 'https://[^[:space:]]+/actions/runs/[0-9]+' <<< "$output" | head -n1 || true)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Link the run in the reply
        if: ${{ steps.dispatch.outputs.url != '' }}
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@devops-1843/test-e2e-run-reply
        with:
          mode: link
          check-run-id: ${{ matrix.run.check-run-id }}
          run-url: ${{ steps.dispatch.outputs.url }}

      - name: Close check if dispatch failed
        if: ${{ always() && steps.dispatch.outcome == 'failure' }}
        uses: loft-sh/github-actions/.github/actions/comment-triggered-check@devops-1843/test-e2e-run-reply
        with:
          mode: finish
          check-run-id: ${{ matrix.run.check-run-id }}
          suite-result: failure
          summary: "Could not start the mock Platform suite."
          details-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail if dispatch failed
        if: ${{ always() && steps.dispatch.outcome == 'failure' }}
        run: exit 1
